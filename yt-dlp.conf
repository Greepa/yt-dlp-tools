# ============================================================
#  yt-dlp configuration  (portable version for GitHub)
#  Engine: https://github.com/yt-dlp/yt-dlp
#  Usage : yt-dlp.exe --config-location yt-dlp.conf <URL>
#
#  NOTE 1 - SAVE AS GBK/ANSI ON CHINESE WINDOWS
#         yt-dlp reads this file as GBK on Chinese Windows.
#         Saving as UTF-8 with non-ASCII text throws:
#         'gbk' codec can't decode byte ...
#         Keep comments ASCII, or save the file as ANSI.
#  NOTE 2 - USE FORWARD SLASHES IN PATHS
#         A backslash is treated as an escape char and gets
#         eaten (E:\foo -> E:foo). Always use E:/foo style.
#  NOTE 3 - PATHS ARE RELATIVE (./) SO YOU CAN CLONE ANYWHERE
#         The .bat scripts always cd into this folder first,
#         so ./ resolves to this directory automatically.
# ============================================================

# ---- 1. ffmpeg location (next to this config) ----
--ffmpeg-location ./

# ---- 2. Bilibili cookie (fixes HTTP 412 + unlocks 1080P) ----
# Run set_cookie.bat to generate cookies.txt, then uncomment:
# --cookies ./cookies.txt

# ---- 3. spoofed user-agent (avoid UA-based blocking) ----
--user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

# ---- 4. politeness: throttle + retry ----
# Without a cookie, Bilibili 412s almost immediately. Cookie is
# the real fix (see set_cookie.bat); these just soften the blows.
--sleep-requests 2
--sleep-interval 3
--max-sleep-interval 8
--extractor-retries 10
--retries 10
--fragment-retries 10
--retry-sleep 5

# ---- 5. output template (into ./downloads) ----
# --restrict-filenames is OFF on purpose: it turns Chinese titles
# into underscores. Keep it off to preserve CJK titles.
-o "./downloads/%(uploader|Unknown)s/%(title).150s [%(id)s].%(ext)s"
--windows-filenames

# ---- 6. sidecar metadata ----
--write-info-json
--write-thumbnail

# ---- 7. subtitles (great for script analysis) ----
--write-auto-subs
--write-subs
--sub-langs "zh-Hans.*,zh-CN.*,zh-Hant.*,en.*"

# ---- 8. resume / no temp fragments ----
--continue
--no-part

# ---- 9. format: cap at 1080p, best available audio ----
# Bilibili 1080P high-bitrate needs a logged-in (premium) cookie.
-f "bv*[height<=1080]+ba/b[height<=1080]/bv*+ba/b"

# ---- 10. post-processing (needs ffmpeg) ----
--merge-output-format mp4
--convert-subs srt
--embed-metadata

# ============================================================
#  Optional toggles - remove the leading # to enable
# ============================================================
# --embed-subs
# --embed-thumbnail
# --extract-audio
# --audio-format mp3

# ---- YouTube / X need a proxy (no proxy is bundled) ----
# --proxy http://127.0.0.1:7890
